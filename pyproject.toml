[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-guided-grasp-retargeting"
version = "0.1.0"
description = "Contact-guided retargeting of annotated human grasp videos across robot hand morphologies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2",
    "scipy>=1.10",
    "mujoco==3.3.7",
    "trimesh>=3.23.5,<5",
    "rtree>=1.0",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8,<4.12", "pyrender==0.1.45", "mediapy>=1.2,<2"]

[project.scripts]
grasp-retarget = "grasp_retargeting.cli:main"

[tool.setuptools]
packages = ["grasp_retargeting"]

[tool.setuptools.package-data]
grasp_retargeting = ["models.json"]
